<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Emerald Nonwovens | 設備零件更換備料預測</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:      #ffffff;
    --surface-2:      #fcfcfb;
    --page-plane:     #f4f4f2;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --muted:          #898781;
    --gridline:       #eceae4;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.08);
    --accent:         #2a78d6;
    --accent-soft:    rgba(42,120,214,0.10);
    --seq-250: #86b6ef;
    --seq-350: #5598e7;
    --seq-450: #2a78d6;
    --seq-550: #1c5cab;
    --seq-650: #104281;
    --cat-1: #2a78d6; /* blue     - ELECTRICAL */
    --cat-2: #eb6834; /* orange   - MECHANICAL */
    --cat-3: #1baf7a; /* aqua     - PNEUMATIC */
    --cat-4: #eda100; /* yellow   - SUPPLIES */
    --cat-5: #e87ba4; /* magenta  - LUBRICATION */
    --good:     #0ca30c;
    --warning:  #fab219;
    --serious:  #ec835a;
    --critical: #d03b3b;
    --mixed:    #7c5cbf;
    --good-text: #006300;
    --shadow-sm: 0 1px 2px rgba(11,11,11,0.04), 0 1px 1px rgba(11,11,11,0.03);
    --shadow-md: 0 4px 16px rgba(11,11,11,0.06), 0 1px 3px rgba(11,11,11,0.05);
    --shadow-lg: 0 12px 40px rgba(11,11,11,0.14), 0 2px 8px rgba(11,11,11,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --surface-1:      #201f1e;
      --surface-2:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --muted:          #8f8d86;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.09);
      --accent:         #3987e5;
      --accent-soft:    rgba(57,135,229,0.16);
      --seq-250: #86b6ef; --seq-350: #5598e7; --seq-450: #3987e5; --seq-550: #184f95; --seq-650: #104281;
      --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181;
      --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e66767; --mixed: #9a80d6;
      --good-text: #0ca30c;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1:      #201f1e;
    --surface-2:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --muted:          #8f8d86;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.09);
    --accent:         #3987e5;
    --accent-soft:    rgba(57,135,229,0.16);
    --seq-250: #86b6ef; --seq-350: #5598e7; --seq-450: #3987e5; --seq-550: #184f95; --seq-650: #104281;
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e66767; --mixed: #9a80d6;
    --good-text: #0ca30c;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
    --shadow-lg: 0 20px 60px rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--page-plane); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden; }
  body { padding: 0 0 60px; }
  ::selection { background: var(--accent-soft); }

  .top-accent { height: 5px; background: linear-gradient(90deg, var(--cat-1), var(--cat-3), var(--cat-4), var(--cat-2), var(--cat-5)); }

  .hero {
    background: linear-gradient(120deg, #1c5cab 0%, #2a78d6 45%, #1baf7a 100%);
    padding: 26px 32px 22px;
    position: relative;
  }
  .hero-inner { max-width: 1440px; margin: 0 auto; display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; position: relative; z-index: 1; }
  .eyebrow {
    display:inline-flex; align-items:center; gap:6px; font-size: 11.5px; font-weight:700;
    color: rgba(255,255,255,0.92); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px;
  }
  .eyebrow .dot { width:6px; height:6px; border-radius:50%; background: #fff; }
  .brand h1 { font-size: 22px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; color: #fff; }
  .brand .sub { color: rgba(255,255,255,0.9); font-size: 13.5px; margin: 0; max-width: 660px; line-height:1.5; }
  .brand .sub2 { color: rgba(255,255,255,0.68); font-size: 12px; margin: 8px 0 0; }

  .hero-controls { display:flex; align-items:center; gap:8px; flex: none; flex-wrap: wrap; }
  .lang-switch { display:flex; background: rgba(255,255,255,0.14); border:1px solid rgba(255,255,255,0.28); border-radius:10px; padding:3px; gap:2px; backdrop-filter: blur(4px); }
  .lang-btn { border:none; background:transparent; color: rgba(255,255,255,0.85); font-size:12px; font-weight:600;
    padding: 6px 11px; border-radius: 7px; cursor:pointer; transition: all .15s ease; }
  .lang-btn:hover { color: #fff; background: rgba(255,255,255,0.12); }
  .lang-btn.active { background: #fff; color: #1c5cab; }
  .theme-toggle {
    border: 1px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.14); color: #fff;
    border-radius: 10px; padding: 8px 14px; font-size: 12.5px; cursor: pointer; backdrop-filter: blur(4px);
    transition: all .15s ease; flex: none;
  }
  .theme-toggle:hover { background: rgba(255,255,255,0.24); transform: translateY(-1px); }

  .wrap { max-width: 1440px; margin: 0 auto; padding: 22px 32px 0; }

  .tiles { display:grid; grid-template-columns: repeat(7, 1fr); gap: 14px; margin-bottom: 20px; }
  @media (max-width: 1300px){ .tiles{ grid-template-columns: repeat(4,1fr);} }
  @media (max-width: 640px){ .tiles{ grid-template-columns: repeat(2,1fr);} }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-top: 3px solid var(--border); border-radius: 14px;
    padding: 16px 18px; box-shadow: var(--shadow-sm); transition: box-shadow .15s ease, transform .15s ease;
    cursor: pointer;
  }
  .tile:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .tile .icon-badge {
    width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    margin-bottom: 10px; font-size: 16px;
  }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom:4px; font-weight:500; }
  .tile .value { font-size: 30px; font-weight: 700; font-variant-numeric: proportional-nums; letter-spacing:-0.02em; }
  .tile.total { border-top-color: var(--accent); }
  .tile.total .icon-badge { background: var(--accent-soft); color: var(--accent); }
  .tile.increase { border-top-color: var(--critical); }
  .tile.increase .icon-badge { background: color-mix(in srgb, var(--critical) 18%, transparent); color: var(--critical); }
  .tile.decrease { border-top-color: var(--warning); }
  .tile.decrease .icon-badge { background: color-mix(in srgb, var(--warning) 22%, transparent); color: #9a6a00; }
  .tile.unset { border-top-color: var(--serious); }
  .tile.unset .icon-badge { background: color-mix(in srgb, var(--serious) 20%, transparent); color: var(--serious); }
  .tile.mixed { border-top-color: var(--mixed); }
  .tile.mixed .icon-badge { background: color-mix(in srgb, var(--mixed) 18%, transparent); color: var(--mixed); }
  .tile.ok { border-top-color: var(--good); }
  .tile.ok .icon-badge { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good-text); }
  .tile.nodata { border-top-color: var(--muted); }
  .tile.nodata .icon-badge { background: var(--gridline); color: var(--muted); }
  .tile.increase .value { color: var(--critical); }
  .tile.decrease .value { color: #9a6a00; }
  .tile.unset .value { color: var(--serious); }
  .tile.mixed .value { color: var(--mixed); }
  .tile.ok .value { color: var(--good-text); }

  .panels { display:grid; grid-template-columns: 1.1fr 1.4fr; gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px){ .panels{ grid-template-columns: 1fr; } }
  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow-sm); }
  .panel h2 { font-size: 13.5px; margin: 0 0 4px; font-weight: 600; }
  .panel .hint { font-size: 11.5px; color: var(--muted); margin: 0 0 14px; }

  .barrow { display:flex; align-items:center; gap:10px; margin: 9px 0; }
  .barrow .name { width: 78px; font-size: 12px; color: var(--text-secondary); flex: none; text-align:right;}
  .barrow .track { flex:1; background: var(--gridline); border-radius: 5px; height: 16px; position:relative; overflow:hidden;}
  .barrow .fill { height:100%; border-radius: 5px; transition: width .4s ease; }
  .barrow .count { width: 40px; font-size: 12px; color: var(--text-secondary); flex:none; font-variant-numeric: tabular-nums;}

  .hbar-item { margin: 8px 0; cursor:pointer; }
  .hbar-item .top-line { display:flex; justify-content:space-between; gap:10px; font-size:11.5px; color: var(--text-secondary); margin-bottom:3px; }
  .hbar-item .top-line b { color: var(--text-primary); font-weight:600; }
  .hbar-item .top-line .name-part { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hbar-item .track { background: var(--gridline); border-radius:5px; height:11px; overflow:hidden; }
  .hbar-item .fill { height:100%; border-radius:5px; background: var(--critical); transition: width .4s ease; }
  .hbar-item:hover .fill { filter: brightness(1.08); }

  /* --- searchable combobox --- */
  .searchbox { position: relative; flex: 1 1 280px; min-width: 220px; }
  .searchbox .field {
    display:flex; align-items:center; gap:8px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; transition: border-color .15s ease, box-shadow .15s ease;
  }
  .searchbox .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .searchbox svg { flex:none; opacity:.5; }
  .searchbox input { flex:1; border:none; background:transparent; outline:none; color: var(--text-primary); font-size: 13px; min-width:0; }
  .searchbox input::placeholder { color: var(--muted); }
  .searchbox .clear-btn { border:none; background:none; color: var(--muted); cursor:pointer; font-size:14px; padding:2px 4px; border-radius:6px; }
  .searchbox .clear-btn:hover { background: var(--gridline); color: var(--text-primary); }
  .dropdown-panel {
    position:absolute; top: calc(100% + 6px); left:0; right:0; z-index: 20;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow-lg); max-height: 360px; overflow-y:auto; padding: 6px;
  }
  .dropdown-item { display:flex; align-items:center; gap:10px; padding: 9px 10px; border-radius: 8px; cursor:pointer; }
  .dropdown-item:hover, .dropdown-item.active { background: var(--accent-soft); }
  .dropdown-item .d-code { font-weight:700; font-size:12.5px; flex: none; width: 78px; }
  .dropdown-item .d-name { font-size:12.5px; color: var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .dropdown-empty { padding: 16px; text-align:center; color: var(--muted); font-size:12.5px; }

  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); position: relative; z-index: 5; }
  .toolbar select {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; color: var(--text-primary); font-size: 13px;
  }
  .toolbar .count-label { font-size: 12px; color: var(--muted); margin-left:auto; white-space:nowrap;}
  .toolbar button.csv {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
    border-radius: 10px; padding: 8px 14px; font-size: 12.5px; cursor:pointer; transition: all .15s ease;
    display:flex; align-items:center; gap:6px;
  }
  .toolbar button.csv:hover { color: var(--text-primary); box-shadow: var(--shadow-sm); }

  .table-wrap { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    overflow: auto; max-height: 68vh; box-shadow: var(--shadow-sm); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  thead th { position: sticky; top:0; background: var(--surface-1); z-index: 1; text-align: left; padding: 10px 12px;
    font-weight:600; color: var(--text-secondary); border-bottom: 1px solid var(--gridline); cursor: pointer;
    white-space: nowrap; user-select:none; }
  thead th:hover { color: var(--text-primary); }
  thead th.sorted { color: var(--accent); }
  thead th.sorted::after { content: attr(data-arrow); margin-left: 4px; color: var(--accent); }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--gridline); vertical-align: top; }
  tbody tr { cursor: pointer; transition: background .1s ease; }
  tbody tr:hover { background: var(--accent-soft); }
  tbody tr.increase { box-shadow: inset 3px 0 0 var(--critical); }
  tbody tr.decrease { box-shadow: inset 3px 0 0 var(--warning); }
  tbody tr.unset { box-shadow: inset 3px 0 0 var(--serious); }
  tbody tr.mixed { box-shadow: inset 3px 0 0 var(--mixed); }
  tbody tr.ok { box-shadow: inset 3px 0 0 var(--good); }
  tbody tr.nodata { box-shadow: inset 3px 0 0 var(--gridline); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .code-link { font-weight: 700; white-space:nowrap; color: var(--accent); display:inline-flex; align-items:center; gap:4px; }
  .code-link:hover { text-decoration: underline; }
  .name-cell { max-width: 230px; }
  .name-th { font-size: 12.5px; }
  .name-en { font-size: 11px; color: var(--muted); }

  .badge { display:inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight:600;
    border: 1px solid var(--border); white-space:nowrap; }
  .badge.freq-high { background: color-mix(in srgb, var(--seq-650) 24%, transparent); color: var(--seq-650); }
  .badge.freq-mid { background: color-mix(in srgb, var(--seq-450) 24%, transparent); color: var(--seq-450); }
  .badge.freq-low { background: color-mix(in srgb, var(--seq-350) 24%, transparent); color: var(--seq-350); }
  .badge.freq-rare { background: color-mix(in srgb, var(--seq-250) 38%, transparent); color: var(--text-secondary); }
  .badge.freq-never { background: var(--gridline); color: var(--muted); }

  .chip { display:inline-flex; align-items:center; gap:6px; padding: 3px 10px 3px 8px; border-radius: 999px;
    font-size: 11.5px; font-weight:600; white-space:nowrap; }
  .chip .cdot { width:7px; height:7px; border-radius:50%; flex:none; }
  .chip.g-electrical { background: color-mix(in srgb, var(--cat-1) 16%, transparent); color: var(--cat-1); }
  .chip.g-electrical .cdot { background: var(--cat-1); }
  .chip.g-mechanical { background: color-mix(in srgb, var(--cat-2) 16%, transparent); color: var(--cat-2); }
  .chip.g-mechanical .cdot { background: var(--cat-2); }
  .chip.g-pneumatic { background: color-mix(in srgb, var(--cat-3) 16%, transparent); color: var(--cat-3); }
  .chip.g-pneumatic .cdot { background: var(--cat-3); }
  .chip.g-supplies { background: color-mix(in srgb, var(--cat-4) 20%, transparent); color: #8a6400; }
  .chip.g-supplies .cdot { background: var(--cat-4); }
  .chip.g-lubrication { background: color-mix(in srgb, var(--cat-5) 18%, transparent); color: var(--cat-5); }
  .chip.g-lubrication .cdot { background: var(--cat-5); }
  .chip.g-other { background: var(--gridline); color: var(--muted); }
  .chip.g-other .cdot { background: var(--muted); }

  .delta { font-weight:700; font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--critical); }
  .delta.down { color: #9a6a00; }
  .delta.flat { color: var(--muted); }

  .note-tag { display:inline-flex; align-items:center; gap:6px; font-size: 11.5px; font-weight:600; white-space:nowrap;
    padding: 3px 10px; border-radius: 999px; }
  .note-tag.increase { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical); }
  .note-tag.decrease { background: color-mix(in srgb, var(--warning) 20%, transparent); color: #9a6a00; }
  .note-tag.unset { background: color-mix(in srgb, var(--serious) 16%, transparent); color: var(--serious); }
  .note-tag.mixed { background: color-mix(in srgb, var(--mixed) 16%, transparent); color: var(--mixed); }
  .note-tag.ok { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good-text); }
  .note-tag.nodata { background: var(--gridline); color: var(--muted); }

  footer.methodology { margin-top: 18px; font-size: 11.5px; color: var(--muted); line-height:1.6;
    background: var(--surface-1); border:1px solid var(--border); border-radius:14px; padding: 16px 20px; }
  footer.methodology b { color: var(--text-secondary); }

  /* --- detail drawer --- */
  .overlay { position: fixed; inset:0; background: rgba(0,0,0,0.35); backdrop-filter: blur(2px);
    opacity:0; pointer-events:none; transition: opacity .2s ease; z-index: 50; }
  .overlay.open { opacity:1; pointer-events:auto; }
  .drawer { position: fixed; top:0; right:0; height:100vh; width: min(520px, 92vw); background: var(--surface-1);
    box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .25s ease; z-index: 51;
    display:flex; flex-direction:column; }
  .drawer.open { transform: translateX(0); }
  .drawer-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--border); }
  .drawer-head .top-row { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .drawer-head h3 { margin:0 0 4px; font-size: 17px; font-weight:700; }
  .drawer-head .code { color: var(--accent); font-weight:700; font-size:12.5px; }
  .drawer-close { border:none; background: var(--surface-2); color: var(--text-secondary); width:30px; height:30px;
    border-radius: 9px; cursor:pointer; font-size:15px; flex:none; }
  .drawer-close:hover { color: var(--text-primary); }
  .drawer-body { padding: 18px 22px; overflow-y:auto; flex:1; }
  .drawer-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .drawer-stat { background: var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
  .drawer-stat .k { font-size:11px; color: var(--muted); margin-bottom:3px; }
  .drawer-stat .v { font-size:15px; font-weight:700; }
  .drawer-reco { border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; font-size:13px; line-height:1.6; }
  .drawer-reco.increase { background: color-mix(in srgb, var(--critical) 10%, transparent); border:1px solid color-mix(in srgb, var(--critical) 30%, transparent); }
  .drawer-reco.decrease { background: color-mix(in srgb, var(--warning) 14%, transparent); border:1px solid color-mix(in srgb, var(--warning) 35%, transparent); }
  .drawer-reco.unset { background: color-mix(in srgb, var(--serious) 10%, transparent); border:1px solid color-mix(in srgb, var(--serious) 30%, transparent); }
  .drawer-reco.mixed { background: color-mix(in srgb, var(--mixed) 10%, transparent); border:1px solid color-mix(in srgb, var(--mixed) 30%, transparent); }
  .drawer-reco.ok { background: color-mix(in srgb, var(--good) 8%, transparent); border:1px solid color-mix(in srgb, var(--good) 25%, transparent); }
  .drawer-reco.nodata { background: var(--surface-2); border:1px solid var(--border); }
  .pdf-link { display:inline-flex; align-items:center; gap:7px; background: var(--accent); color:#fff; text-decoration:none;
    padding: 9px 16px; border-radius: 10px; font-size:13px; font-weight:600; margin-bottom:18px; transition: opacity .15s ease; }
  .pdf-link:hover { opacity:.88; }

  .year-chart-wrap { background: var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:14px 16px 10px; margin-bottom:18px; }
  .year-chart-wrap h4 { margin:0 0 3px; }
  .year-chart-wrap .hint { margin: 0 0 14px; }
  .year-chart { display:flex; align-items:flex-end; gap:8px; height:140px; position:relative; }
  .year-avg-line { position:absolute; left:0; right:0; border-top:2px dashed var(--accent); z-index:0; }
  .year-flat-line { position:absolute; left:0; right:0; border-top:2px dotted var(--muted); z-index:0; }
  .year-avg-tag { position:absolute; right:0; top:-9px; font-size:10px; color: var(--muted); background: var(--surface-2); padding:0 4px; }
  .ybar-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; position:relative; z-index:1; min-width: 0; }

let LANG = localStorage.getItem('dashboard_lang') || 'zh';

// mirrors analyze.py: insufficient data always wins (a matching current==reco is "we don't know
// yet", not "confirmed OK"), then classify on BOTH Min and Max deltas — a part can have a fine
// Min but a badly over/under-sized Max (or vice versa), which a Min-only check would miss entirely
function classifyReco(current_min, current_max, reco_min, reco_max, insufficient){
  const reco = (reco_min === null || reco_min === undefined) ? null : Number(reco_min);
  if (insufficient || reco === null) return { recoType: 'nodata', minDelta: null, maxDelta: null };
  const cur = (current_min === null || current_min === undefined) ? null : Number(current_min);
  if (cur === null) return { recoType: 'unset', minDelta: null, maxDelta: null };
  const curMax = (current_max === null || current_max === undefined) ? null : Number(current_max);
  const minDelta = reco - cur;
  const maxDelta = curMax === null ? null : Number(reco_max) - curMax;
  const needsMinUp = minDelta >= 1, needsMinDown = minDelta <= -1;
  const needsMaxUp = maxDelta !== null && maxDelta >= 1;
  const needsMaxDown = maxDelta !== null && maxDelta <= -1;
  const anyUp = needsMinUp || needsMaxUp, anyDown = needsMinDown || needsMaxDown;
  let recoType;
  if (anyUp && anyDown) recoType = 'mixed';
  else if (anyUp) recoType = 'increase';
  else if (anyDown) recoType = 'decrease';
  else recoType = 'ok';
  return { recoType, minDelta, maxDelta };
}

const items = DATA.items.map(it => {
  const cls = classifyReco(it.current_min, it.current_max, it.reco_min, it.reco_max, it.insufficient);
  return Object.assign({}, it, { delta: cls.minDelta, minDelta: cls.minDelta, maxDelta: cls.maxDelta, recoType: cls.recoType });
});
const itemByCode = {};
items.forEach(it => itemByCode[it.code] = it);

const MANUAL_KEY = 'sp_manual_entries_v1';
function loadManualStore(){
  try { return JSON.parse(localStorage.getItem(MANUAL_KEY) || '{}'); } catch(e){ return {}; }
}
function saveManualStore(store){
  localStorage.setItem(MANUAL_KEY, JSON.stringify(store));
}
function manualCount(store){
  return Object.values(store).reduce((sum, arr) => sum + arr.length, 0);
}

const TODAY = new Date('2026-08-03T00:00:00');
function daysBetween(a, b){ return Math.round((b - a) / 86400000); }

// mirrors analyze.py's per-item calculation, so recommendations recompute live as records are added
function computeStats(history, currentMin, currentMax){
  const sorted = history.slice().sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  const iss = sorted.filter(h=>h.type==='ISS');
  const rec = sorted.filter(h=>h.type==='REC');
  const nIss = iss.length, nRec = rec.length;
  const totalIss = iss.reduce((s,h)=> s+Number(h.qty), 0);
  const totalRec = rec.reduce((s,h)=> s+Number(h.qty), 0);

  let firstDate = null, lastDate = null, spanDays = 0, spanYears = 0;
  if (sorted.length){
    firstDate = new Date(sorted[0].date);
    lastDate = new Date(sorted[sorted.length-1].date);
    spanDays = Math.max(daysBetween(firstDate, TODAY), 1);
    spanYears = spanDays / 365;
  }
  const usagePerYearFlat = spanYears > 0 ? totalIss / spanYears : 0;
  const issuesPerYearFlat = spanYears > 0 ? nIss / spanYears : 0;

  // Croston's method (SBA variant, mirrors analyze.py): most parts are used rarely and irregularly
  // ("intermittent demand"), which a plain or windowed average handles poorly. Croston smooths two
  // things separately: typical size per issue (Z) and days between issues (P); forecast = Z/P,
  // corrected by the Syntetos-Boylan factor (1 - alpha/2) to remove Croston's known upward bias.
  const CROSTON_ALPHA = 0.2;
  // need this many occurrences before trusting the smoothed estimate — with only 2-3 points the
  // "smoothed" Z/P values ARE the raw data (no averaging has happened yet), so a single short gap
  // between two events can extrapolate into a huge annualized rate
  const CROSTON_MIN_OCCURRENCES = 4;
  // sanity cap: never let the smoothed forecast exceed N x the simple lifetime average — guards
  // against a cluster of closely-spaced transactions dragging the smoothed interval down and
  // inflating the rate, with no later data to pull it back afterward
  const CROSTON_MAX_MULTIPLE = 3.0;
  let usagePerYear = usagePerYearFlat, issuesPerYear = issuesPerYearFlat;
  let smoothedIssInterval = null;
  if (nIss >= CROSTON_MIN_OCCURRENCES){
    const sizesAll = iss.map(h=>Number(h.qty));
    const sizes = sizesAll.slice(1);
    const intervals = [];
    for (let i=1;i<iss.length;i++) intervals.push(Math.max(daysBetween(new Date(iss[i-1].date), new Date(iss[i].date)), 1));
    let Z = sizes[0], P = intervals[0];
    for (let i=1;i<sizes.length;i++){
      Z = CROSTON_ALPHA*sizes[i] + (1-CROSTON_ALPHA)*Z;
      P = CROSTON_ALPHA*intervals[i] + (1-CROSTON_ALPHA)*P;
    }
    const sbaDailyRate = (1 - CROSTON_ALPHA/2) * (Z / P);
    usagePerYear = sbaDailyRate * 365;
    issuesPerYear = 365 / P;
    smoothedIssInterval = P;
    if (usagePerYearFlat > 0) usagePerYear = Math.min(usagePerYear, usagePerYearFlat * CROSTON_MAX_MULTIPLE);
  }

  function avgInterval(dates){
    if (dates.length < 2) return null;
    let sum = 0;
    for (let i=1;i<dates.length;i++) sum += daysBetween(new Date(dates[i-1].date), new Date(dates[i].date));
    return sum / (dates.length - 1);
  }
  const avgRecInterval = avgInterval(rec);
  const avgIssInterval = avgInterval(iss);
  const avgIssQtyPerTx = nIss ? totalIss/nIss : 0;
  const avgRecQtyPerTx = nRec ? totalRec/nRec : 0;
  const dailyUsage = usagePerYear / 365;

  let freqClass;
  if (nIss === 0) freqClass = '從未領用';
  else if (issuesPerYear >= 4) freqClass = '高頻';
  else if (issuesPerYear >= 1.5) freqClass = '中頻';
  else if (issuesPerYear >= 0.4) freqClass = '低頻';
  else freqClass = '極少使用';

  let recoMin = null, recoMax = null;
  const insufficient = (nIss < 2 || spanYears < 0.5);
  if (insufficient){
    recoMin = currentMin; recoMax = currentMax;
  } else {
    const safetyFactor = 1.3;
    let cycle = avgRecInterval || smoothedIssInterval || avgIssInterval || 90;
    cycle = Math.min(Math.max(cycle, 14), 365);
    const rawMin = dailyUsage * cycle * safetyFactor;
    recoMin = Math.max(1, Math.ceil(rawMin));
    recoMax = recoMin + Math.max(1, Math.ceil(avgIssQtyPerTx > 0 ? avgIssQtyPerTx : avgRecQtyPerTx));
  }

  return {
    n_transactions: sorted.length, n_issues: nIss, n_receipts: nRec,
    total_issued_qty: totalIss, total_received_qty: totalRec,
    first_date: firstDate ? firstDate.toISOString().slice(0,10) : null,
    last_date: lastDate ? lastDate.toISOString().slice(0,10) : null,
    usage_per_year: Math.round(usagePerYear*100)/100, issues_per_year: Math.round(issuesPerYear*100)/100,
    usage_per_year_flat: Math.round(usagePerYearFlat*100)/100, issues_per_year_flat: Math.round(issuesPerYearFlat*100)/100,
    freq_class: freqClass, insufficient, reco_min: recoMin, reco_max: recoMax,
    history: sorted,
  };
}

function recomputeItem(it){
  const merged = (it.originalHistory || it.history || []).concat(loadManualStore()[it.code] || []);
  const stats = computeStats(merged, it.current_min, it.current_max);
  Object.assign(it, stats);
  const cls = classifyReco(it.current_min, it.current_max, it.reco_min, it.reco_max, stats.insufficient);
  it.delta = cls.minDelta;
  it.minDelta = cls.minDelta;
  it.maxDelta = cls.maxDelta;
  it.recoType = cls.recoType;
}

// shared by both the per-item drawer form and the manage-panel form
function addManualEntry(code, dateVal, typeVal, qtyVal, docVal){
  const it = itemByCode[code];
  if (!it) return;
  const store = loadManualStore();
  if (!store[code]) store[code] = [];
  const allHist = (it.originalHistory || []).concat(store[code]);
  const lastBalance = allHist.length ? allHist.slice().sort((a,b)=> a.date < b.date ? -1 : 1)[allHist.length-1].balance || 0 : (it.stock_on_hand || 0);
  const newBalance = typeVal === 'REC' ? (lastBalance||0) + qtyVal : Math.max(0, (lastBalance||0) - qtyVal);
  store[code].push({ date: dateVal, type: typeVal, qty: qtyVal, balance: newBalance, doc_no: docVal || null, manual: true });
  saveManualStore(store);
  recomputeItem(it);
  renderChrome();
}

(function mergeManualOnLoad(){

  Object.keys(store).forEach(code=>{

  });
})();

function computeSummaryFromItems(){
  const dist = {};
  freqOrder.forEach(k => dist[k] = 0);
  let inc=0, dec=0, mixed=0, unset=0, ok=0, nodata=0;
  items.forEach(it=>{
    dist[it.freq_class] = (dist[it.freq_class]||0) + 1;
    if (it.recoType==='increase') inc++;
    else if (it.recoType==='decrease') dec++;
    else if (it.recoType==='mixed') mixed++;
    else if (it.recoType==='unset') unset++;
    else if (it.recoType==='ok') ok++;
    else nodata++;
  });
  return { total_items: items.length, items_increase: inc, items_decrease: dec, items_mixed: mixed,
    items_unset: unset, items_ok: ok, items_no_data: nodata, freq_distribution: dist };
}

function noteTag(it){

}

function buildYearlyUsage(it){
  const hist = (it.history || []).filter(h=>h.type==='ISS');
  if (!hist.length) return [];
  const nowYear = TODAY.getFullYear();
  let minYear = nowYear;
  hist.forEach(h=>{ const y = parseInt(h.date.slice(0,4),10); if (y < minYear) minYear = y; });
  const buckets = {};
  for (let y=minYear; y<=nowYear; y++) buckets[y] = 0;
  hist.forEach(h=>{
    const y = parseInt(h.date.slice(0,4),10);
    buckets[y] = (buckets[y]||0) + Number(h.qty);
  });
  return Object.keys(buckets).sort().map(y=> ({ year: Number(y), qty: Math.round(buckets[y]*100)/100 }));
}

function yearlyChartHtml(it){
  const data = buildYearlyUsage(it);
  if (!data.length) return '';
  const weighted = it.usage_per_year || 0;
  const flat = it.usage_per_year_flat || 0;
  const max = Math.max(...data.map(d=>d.qty), weighted, flat, 1);
  const weightedPct = Math.max(0, Math.min(100, (weighted/max*100)));
  const flatPct = Math.max(0, Math.min(100, (flat/max*100)));
  const curYear = TODAY.getFullYear();
  const bars = data.map(d=>{
    const pct = max ? (d.qty/max*100) : 0;
    const isCurrent = d.year === curYear;
    return `<div class="ybar-col${isCurrent?' current':''}">
      <div class="ybar-value">${d.qty}</div>
      <div class="ybar-track"><div class="ybar-fill" style="height:${pct}%"></div></div>
      <div class="ybar-label">${d.year}${isCurrent ? escapeHtml(T('yearPartialTag')) : ''}</div>
    </div>`;
  }).join('');
  return `<div class="year-chart-wrap">
    <h4>${T('yearlyChartTitle')}</h4>
    <p class="hint">${T('yearlyChartHint')}</p>
    <div class="year-chart">
      <div class="year-flat-line" style="bottom:${flatPct}%"></div>
      <div class="year-avg-line" style="bottom:${weightedPct}%"></div>
      ${bars}
    </div>
    <div class="year-chart-legend">${escapeHtml(T('yearlyAvgLabel')(weighted, flat))}</div>
  </div>`;
}

const groupsAll = Array.from(new Set(items.map(i=>i.group).filter(Boolean))).sort();
const freqOrder = ['從未領用','極少使用','低頻','中頻','高頻'];
const freqColor = {'從未領用':'var(--gridline)','極少使用':'var(--seq-250)','低頻':'var(--seq-350)','中頻':'var(--seq-450)','高頻':'var(--seq-650)'};

let sortKey = 'delta';
let sortDir = -1;

function currentFilters(){
  return {
    q: document.getElementById('search').value.trim().toLowerCase(),
    group: document.getElementById('filter-group').value,
    freq: document.getElementById('filter-freq').value,
    reco: document.getElementById('filter-reco').value,
  };
}
function applyFilters(list){
  const f = currentFilters();
  return list.filter(it=>{
    if (f.group && it.group !== f.group) return false;
    if (f.freq && it.freq_class !== f.freq) return false;
    if (f.reco && it.recoType !== f.reco) return false;
    if (f.q){
      const hay = [it.code, it.name_th, it.name_en, it.vendor, it.location, it.model].filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(f.q) === -1) return false;
    }
    return true;
  });
}
function sortList(list){
  const dir = sortDir;
  return list.slice().sort((a,b)=>{
    let va = a[sortKey], vb = b[sortKey];
    if (va === null || va === undefined) va = (typeof vb === 'number') ? -Infinity : '';
    if (vb === null || vb === undefined) vb = (typeof va === 'number') ? -Infinity : '';
    if (typeof va === 'number' && typeof vb === 'number') return (va-vb)*dir;
    return String(va).localeCompare(String(vb)) * dir;
  });
}

  const tbody = document.getElementById('table-body');
  tbody.innerHTML = pageItems.map(it=>{
    const deltaCls = it.delta > 0 ? 'up' : (it.delta < 0 ? 'down' : 'flat');

      <td><span class="code-link">📄 ${escapeHtml(it.code)}</span></td>

  }).join('');

  const rangeStart = filtered.length ? startIdx + 1 : 0;

  const pager = document.getElementById('pagination');

      <button id="page-next" ${currentPage>=totalPages?'disabled':''}>${escapeHtml(T('pageNext'))} ›</button>
    </div>`;
  const prevBtn = document.getElementById('page-prev');
  const nextBtn = document.getElementById('page-next');
  if (prevBtn) prevBtn.addEventListener('click', ()=>{ currentPage--; render(false); document.querySelector('.table-wrap').scrollIntoView({behavior:'smooth', block:'start'}); });
  if (nextBtn) nextBtn.addEventListener('click', ()=>{ currentPage++; render(false); document.querySelector('.table-wrap').scrollIntoView({behavior:'smooth', block:'start'}); });

  tbody.querySelectorAll('tr').forEach(tr=>{
    tr.addEventListener('click', ()=> openDrawer(tr.dataset.code));
  });
}

const searchInput = document.getElementById('search');

const clearBtn = document.getElementById('clear-search');
let activeIdx = -1;
let currentMatches = [];

function updateDropdown(){
  const q = searchInput.value.trim().toLowerCase();
  clearBtn.style.display = q ? 'inline-block' : 'none';
  if (!q){ dropdownPanel.style.display = 'none'; render(true); return; }
  currentMatches = items.filter(it=>{
    const hay = [it.code, it.name_th, it.name_en, it.vendor, it.location, it.model].filter(Boolean).join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  }).slice(0, 12);
  activeIdx = -1;
  if (!currentMatches.length){
    dropdownPanel.innerHTML = `<div class="dropdown-empty">${T('dropdownEmpty')}</div>`;
  } else {
    dropdownPanel.innerHTML = currentMatches.map((it,i)=>
      `<div class="dropdown-item" data-idx="${i}"><span class="d-code">${escapeHtml(it.code)}</span><span class="d-name">${escapeHtml(it.name_th||'')}</span><span class="badge ${freqBadgeClass(it.freq_class)}">${escapeHtml(freqLabel(it.freq_class))}</span></div>`
    ).join('');
    dropdownPanel.querySelectorAll('.dropdown-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        const it = currentMatches[Number(el.dataset.idx)];
        dropdownPanel.style.display = 'none';
        openDrawer(it.code);
      });
    });
  }
  dropdownPanel.style.display = 'block';

searchInput.addEventListener('input', updateDropdown);
searchInput.addEventListener('focus', ()=>{ if (searchInput.value.trim()) updateDropdown(); });
searchInput.addEventListener('keydown', (e)=>{
  if (dropdownPanel.style.display === 'none') return;
  const els = dropdownPanel.querySelectorAll('.dropdown-item');
  if (e.key === 'ArrowDown'){ e.preventDefault(); activeIdx = Math.min(activeIdx+1, els.length-1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); }
  else if (e.key === 'Enter'){ if (activeIdx>=0 && currentMatches[activeIdx]){ dropdownPanel.style.display='none'; openDrawer(currentMatches[activeIdx].code); } return; }
  else if (e.key === 'Escape'){ dropdownPanel.style.display = 'none'; return; }
  else return;
  els.forEach((el,i)=> el.classList.toggle('active', i===activeIdx));
});

    {key:'usage_per_year', header:T('thUsageQty'), cn:false, type:'number'},
    {key:'current_min', header:T('thCurMin'), cn:false, type:'number'},
    {key:'current_max', header:T('thCurMax'), cn:false, type:'number'},
    {key:'reco_min', header:T('thRecoMin'), cn:false, type:'number'},
    {key:'reco_max', header:T('thRecoMax'), cn:false, type:'number'},
    {key:'delta', header:T('thDelta'), cn:false, type:'number'},
    {key:'reco_note', header:T('thRecoNote'), cn:true, type:'string', val:it=>T('noteText')(it)},
  ];

  // one <Style> per (recoType x isChinese) combo, plus a header style
  const recoTypes = ['increase','decrease','mixed','unset','ok','nodata'];
  let stylesXml = `<Style ss:ID="sHeader"><Font ss:FontName="標楷體" ss:Size="12" ss:Bold="1"/><Interior ss:Color="#${XLS_HEADER_FILL}" ss:Pattern="Solid"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>\n`;
  recoTypes.forEach(rt=>{
    const fill = XLS_ROW_FILL[rt];
    stylesXml += `<Style ss:ID="s_${rt}_cn"><Font ss:FontName="標楷體" ss:Size="12"/><Interior ss:Color="#${fill}" ss:Pattern="Solid"/></Style>\n`;
    stylesXml += `<Style ss:ID="s_${rt}_en"><Font ss:FontName="Times New Roman" ss:Size="12"/><Interior ss:Color="#${fill}" ss:Pattern="Solid"/></Style>\n`;
  });

  let rowsXml = '<Row>' + cols.map(c=>`<Cell ss:StyleID="sHeader"><Data ss:Type="String">${xmlEscape(c.header)}</Data></Cell>`).join('') + '</Row>\n';
  rows.forEach(it=>{
    const rt = it.recoType || 'nodata';
    rowsXml += '<Row>' + cols.map(c=>{
      const styleId = c.cn ? `s_${rt}_cn` : `s_${rt}_en`;
      const raw = c.val ? c.val(it) : it[c.key];
      if (c.type === 'number'){
        const num = (raw===null||raw===undefined||raw==='') ? '' : Number(raw);
        return num===''
          ? `<Cell ss:StyleID="${styleId}"><Data ss:Type="String"></Data></Cell>`
          : `<Cell ss:StyleID="${styleId}"><Data ss:Type="Number">${num}</Data></Cell>`;
      }
      return `<Cell ss:StyleID="${styleId}"><Data ss:Type="String">${xmlEscape(raw)}</Data></Cell>`;
    }).join('') + '</Row>\n';
  });

  return `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles>
${stylesXml}</Styles>
<Worksheet ss:Name="Sheet1">
<Table>
${rowsXml}</Table>
</Worksheet>
</Workbook>`;
}

document.getElementById('export-csv').addEventListener('click', ()=>{
  const rows = window.__filtered || items;
  const xml = buildStyledExcel(rows);
  const blob = new Blob(['﻿' + xml], {type:'application/vnd.ms-excel;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = T('csvFilename');
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ---- detail drawer ----
const overlay = document.getElementById('overlay');
const drawer = document.getElementById('drawer');

function openDrawer(code){
  const it = itemByCode[code];
  if (!it) return;
  document.getElementById('drawer-code').textContent = it.code;
  document.getElementById('drawer-name').textContent = it.name_th || it.name_en || it.code;

  const hist = (it.history || []).slice().sort((a,b)=> a.date < b.date ? 1 : -1);
  const histRows = hist.map(h=>
    `<tr><td>${h.date}</td><td><span class="hist-badge ${h.type}">${h.type==='REC'?T('histRec'):T('histIss')}</span>${h.manual ? `<span class="manual-flag">✏️</span>`:''}</td>
     <td class="num">${h.qty}</td><td class="num">${h.balance ?? '-'}</td><td>${escapeHtml(h.doc_no||'-')}</td></tr>`
  ).join('');
  const todayStr = TODAY.toISOString().slice(0,10);

  document.getElementById('drawer-body').innerHTML = `
    <a class="pdf-link" href="../${encodeURIComponent(it.pdf_file)}" target="_blank" rel="noopener">
      📄 ${T('pdfLinkText')}
    </a>
    <div class="drawer-grid">
      <div class="drawer-stat"><div class="k">${T('drawerGroupLoc')}</div><div class="v" style="font-size:13px;">${groupChip(it.group)} · ${escapeHtml(it.location||'-')}</div></div>
      <div class="drawer-stat"><div class="k">${T('drawerVendor')}</div><div class="v" style="font-size:13px;">${escapeHtml(it.vendor||'-')}</div></div>
      <div class="drawer-stat"><div class="k">${T('drawerFreq')}</div><div class="v"><span class="badge ${freqBadgeClass(it.freq_class)}">${escapeHtml(freqLabel(it.freq_class))}</span></div></div>
      <div class="drawer-stat"><div class="k">${T('drawerIssues')}</div><div class="v">${it.issues_per_year ?? 0}</div></div>
      <div class="drawer-stat"><div class="k">${T('drawerUsageQty')}</div><div class="v">${it.usage_per_year ?? 0}</div></div>
      <div class="drawer-stat"><div class="k">${T('drawerUsageFlat')}</div><div class="v">${it.usage_per_year_flat ?? 0}</div></div>
      <div class="drawer-stat"><div class="k">${T('drawerCurMinMax')}</div><div class="v">${it.current_min ?? '-'} / ${it.current_max ?? '-'}</div></div>
      <div class="drawer-stat"><div class="k">${T('drawerRecoMinMax')}</div><div class="v">${it.reco_min ?? '-'} / ${it.reco_max ?? '-'}</div></div>
    </div>
    <div class="drawer-reco ${it.recoType}"><b>${T('recoLabel')[it.recoType]}</b><br>${escapeHtml(T('noteText')(it))}</div>

    ${yearlyChartHtml(it)}

    <div class="add-record">
      <h4>➕ ${T('addRecordTitle')}</h4>
      <div id="add-record-error" class="add-record-error" style="display:none;"></div>
      <div class="add-record-grid">
        <div><label>${T('addRecordDate')}</label><input type="date" id="ar-date" value="${todayStr}" max="${todayStr}"></div>
        <div><label>${T('addRecordType')}</label>
          <select id="ar-type"><option value="ISS">${T('histIss')}</option><option value="REC">${T('histRec')}</option></select>
        </div>
        <div><label>${T('addRecordQty')}</label><input type="number" id="ar-qty" min="0.01" step="1" value="1"></div>
        <div><label>${T('addRecordDoc')}</label><input type="text" id="ar-doc" placeholder="${T('addRecordDocPlaceholder')}"></div>
      </div>
      <button id="ar-submit">${T('addRecordSubmit')}</button>
    </div>

    <h4>${T('historyTitle')(hist.length)}</h4>
    ${hist.length ? `<table class="hist-table"><thead><tr><th>${T('histDate')}</th><th>${T('histAction')}</th><th class="num">${T('histQty')}</th><th class="num">${T('histBalance')}</th><th>${T('histDoc')}</th></tr></thead><tbody>${histRows}</tbody></table>` : `<div class="no-history">${T('noHistory')}</div>`}
  `;
  overlay.classList.add('open');
  drawer.classList.add('open');

  document.getElementById('ar-submit').addEventListener('click', ()=>{
    const dateVal = document.getElementById('ar-date').value || todayStr;
    const typeVal = document.getElementById('ar-type').value;
    const qtyVal = parseFloat(document.getElementById('ar-qty').value);
    const docVal = document.getElementById('ar-doc').value.trim();
    const errEl = document.getElementById('add-record-error');
    if (!qtyVal || qtyVal <= 0){
      errEl.textContent = T('addRecordInvalid');
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';
    addManualEntry(it.code, dateVal, typeVal, qtyVal, docVal);
    openDrawer(it.code);
  });
}
function closeDrawer(){ overlay.classList.remove('open'); drawer.classList.remove('open'); }
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeDrawer(); });

// ---- manual data management panel (reuses the same drawer) ----
let manageSelectedCode = null;
function openManagePanel(){
  document.getElementById('drawer-code').textContent = '';
  document.getElementById('drawer-name').textContent = T('manageTitle');
  const store = loadManualStore();
  const rows = [];
  Object.keys(store).forEach(code=>{
    store[code].forEach((entry, idx)=>{
      rows.push({ code, idx, entry });
    });
  });
  rows.sort((a,b)=> a.entry.date < b.entry.date ? 1 : -1);

  const rowsHtml = rows.map(r=>{
    const it = itemByCode[r.code];
    const label = r.entry.type === 'REC' ? T('histRec') : T('histIss');
    return `<div class="manage-row">
      <span class="m-code">${escapeHtml(r.code)}</span>
      <span class="m-mid">${r.entry.date} · ${label} · ${r.entry.qty} ${it && it.unit ? escapeHtml(it.unit) : ''}${r.entry.doc_no ? ' · '+escapeHtml(r.entry.doc_no) : ''}</span>
      <button class="m-del" data-code="${escapeHtml(r.code)}" data-idx="${r.idx}">${T('manageDeleteAction')}</button>
    </div>`;
  }).join('');

  const selectedItem = manageSelectedCode ? itemByCode[manageSelectedCode] : null;
  const todayStr = TODAY.toISOString().slice(0,10);
  const addSectionHtml = `
    <div class="add-record">
      <h4>${T('manageAddSectionTitle')}</h4>
      <div id="mgr-picker-box" class="searchbox" style="margin-bottom:10px;${selectedItem?'display:none;':''}">
        <div class="field">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="mgr-picker" placeholder="${T('managePickPlaceholder')}" autocomplete="off">
        </div>
        <div class="dropdown-panel" id="mgr-dropdown" style="display:none;"></div>
      </div>
      ${selectedItem ? `
        <div class="manual-banner" style="margin-bottom:10px;">
          ${escapeHtml(T('manageSelectedPrefix'))}<b>${escapeHtml(selectedItem.code)}</b> ${escapeHtml(selectedItem.name_th||'')}
          <button id="mgr-change-item" style="margin-left:auto;" class="clear-btn">${escapeHtml(T('manageChangeItem'))}</button>
        </div>
        <div id="mgr-add-error" class="add-record-error" style="display:none;"></div>
        <div class="add-record-grid">
          <div><label>${T('addRecordDate')}</label><input type="date" id="mgr-date" value="${todayStr}" max="${todayStr}"></div>
          <div><label>${T('addRecordType')}</label>
            <select id="mgr-type"><option value="ISS">${T('histIss')}</option><option value="REC">${T('histRec')}</option></select>
          </div>
          <div><label>${T('addRecordQty')}</label><input type="number" id="mgr-qty" min="0.01" step="1" value="1"></div>
          <div><label>${T('addRecordDoc')}</label><input type="text" id="mgr-doc" placeholder="${T('addRecordDocPlaceholder')}"></div>
        </div>
        <button id="mgr-submit">${T('addRecordSubmit')}</button>
      ` : `<div class="hint" style="margin:0;">${T('manageNoItemSelected')}</div>`}
    </div>
  `;

  document.getElementById('drawer-body').innerHTML = `
    ${addSectionHtml}
    ${rows.length ? rowsHtml : `<div class="no-history">${T('manageEmpty')}</div>`}
    <div class="manage-actions">
      <button id="manage-export">⬇ ${T('manageExportBtn')}</button>
      ${rows.length ? `<button id="manage-clear-all" class="danger">🗑 ${T('manageClearAllBtn')}</button>` : ''}
    </div>
  `;

  // item picker autocomplete
  const pickerInput = document.getElementById('mgr-picker');
  if (pickerInput){
    const pickerDropdown = document.getElementById('mgr-dropdown');
    pickerInput.addEventListener('input', ()=>{
      const q = pickerInput.value.trim().toLowerCase();
      if (!q){ pickerDropdown.style.display = 'none'; return; }
      const matches = items.filter(it=>{
        const hay = [it.code, it.name_th, it.vendor, it.location, it.model].filter(Boolean).join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      }).slice(0, 12);
      pickerDropdown.innerHTML = matches.length
        ? matches.map(it=> `<div class="dropdown-item" data-code="${escapeHtml(it.code)}"><span class="d-code">${escapeHtml(it.code)}</span><span class="d-name">${escapeHtml(it.name_th||'')}</span></div>`).join('')
        : `<div class="dropdown-empty">${T('dropdownEmpty')}</div>`;
      pickerDropdown.style.display = 'block';
      pickerDropdown.querySelectorAll('.dropdown-item').forEach(el=>{
        el.addEventListener('click', ()=>{
          manageSelectedCode = el.dataset.code;
          openManagePanel();
        });
      });
    });
  }
  const changeBtn = document.getElementById('mgr-change-item');
  if (changeBtn) changeBtn.addEventListener('click', ()=>{ manageSelectedCode = null; openManagePanel(); });

  const mgrSubmit = document.getElementById('mgr-submit');
  if (mgrSubmit) mgrSubmit.addEventListener('click', ()=>{
    const dateVal = document.getElementById('mgr-date').value || todayStr;
    const typeVal = document.getElementById('mgr-type').value;
    const qtyVal = parseFloat(document.getElementById('mgr-qty').value);
    const docVal = document.getElementById('mgr-doc').value.trim();
    const errEl = document.getElementById('mgr-add-error');
    if (!qtyVal || qtyVal <= 0){
      errEl.textContent = T('addRecordInvalid');
      errEl.style.display = 'block';
      return;
    }
    addManualEntry(manageSelectedCode, dateVal, typeVal, qtyVal, docVal);
    openManagePanel();
  });

  document.querySelectorAll('.m-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if (!confirm(T('manageDeleteConfirm'))) return;
      const code = btn.dataset.code, idx = Number(btn.dataset.idx);
      const s = loadManualStore();
      if (s[code]) { s[code].splice(idx, 1); if (!s[code].length) delete s[code]; }
      saveManualStore(s);
      if (itemByCode[code]) recomputeItem(itemByCode[code]);
      renderChrome();
      openManagePanel();
    });
  });
  const clearAllBtn = document.getElementById('manage-clear-all');
  if (clearAllBtn) clearAllBtn.addEventListener('click', ()=>{
    if (!confirm(T('manageClearAllConfirm'))) return;
    const codes = Object.keys(loadManualStore());
    saveManualStore({});
    codes.forEach(code=>{ if (itemByCode[code]) recomputeItem(itemByCode[code]); });
    renderChrome();
    openManagePanel();
  });
  document.getElementById('manage-export').addEventListener('click', ()=>{
    const headers = [T('manageColCode'), T('manageColDate'), T('manageColType'), T('manageColQty'), T('manageColDoc')];
    const lines = [headers.join(',')];
    rows.forEach(r=>{
      const vals = [r.code, r.entry.date, r.entry.type, r.entry.qty, r.entry.doc_no||'']
        .map(v=> '"' + String(v).replace(/"/g,'""') + '"');
      lines.push(vals.join(','));
    });
    const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = T('manageExportFilename');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  overlay.classList.add('open');
  drawer.classList.add('open');
}
document.getElementById('manage-btn').addEventListener('click', ()=>{ manageSelectedCode = null; openManagePanel(); });

// ---- language switch ----
document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    LANG = btn.dataset.lang;
    localStorage.setItem('dashboard_lang', LANG);
    renderChrome();
  });
});

// ---- theme toggle ----
const root = document.documentElement;
document.getElementById('theme-toggle').addEventListener('click', ()=>{
  const cur = root.getAttribute('data-theme');
  if (cur === 'dark') { root.setAttribute('data-theme','light'); }
  else if (cur === 'light') { root.removeAttribute('data-theme'); }
  else { root.setAttribute('data-theme','dark'); }
});

renderChrome();
</script>
